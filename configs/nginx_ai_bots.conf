# Nginx Configuration: Dynamic Pre-rendering & Routing for AI Crawlers
# Dreaper Lab AEO Architecture (https://dreaper.ru/)

map $http_user_agent $is_ai_bot {
    default 0;
    ~*(GPTBot|ChatGPT-User|PerplexityBot|ClaudeBot|Anthropic|YandexRender|Applebot|Google-Extended) 1;
}

server {
    listen 80;
    server_name example.com;

    location / {
        if ($is_ai_bot = 1) {
            # Route directly to pre-rendered SSR markdown / semantic HTML
            rewrite ^ /ssr$request_uri break;
            proxy_pass http://127.0.0.1:3000;
        }
        
        # Standard client application
        try_files $uri $uri/ /index.html;
    }

    location = /llms.txt {
        alias /var/www/static/llms.txt;
        default_type text/plain;
    }
}
